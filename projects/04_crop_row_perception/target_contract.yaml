schema_version: 2

project:
  id: 04_crop_row_perception
  name_zh: 农业机器人多作物行与行间走廊视觉感知学习项目
  task_type: monocular_rgb_multi_crop_row_and_corridor_estimation
  deadline: 2026-09-11

gate:
  name: target_contract
  verdict: PASS
  decision_date: 2026-08-31
  revision_date: 2026-09-05
  confirmation: 用户在Day64完成后授权原位修订Day59合同并重新学习Day63，不新增重复日期目录。
  pass_reason: 多行、边界、走廊、失败成本、指标和证据边界均已定义；数据是否支持全部新指标仍由补充标签审计决定。

change_history:
  - version: 1
    date: 2026-08-31
    scope: 单条中央参考作物行的图像平面几何估计。
  - version: 2
    date: 2026-09-05
    scope: 所有可评价可见作物行、相机中心所在行间走廊的左右边界、走廊中心和多线消失点。
    reason: 单条中央作物行不是机器人应行驶的行间走廊中心。

intended_claim:
  allowed: >-
    在公开、带标注、受支持的前视单目RGB农田图像或视频帧上，学习并评价所有满足标注与可见性规则的
    作物行图像几何，并在相机光轴可作为机器人投影中心代理时选择左右相邻作物行，估计其图像平面走廊中心、
    方向、消失点、置信度和拒绝状态。
  prohibited:
    - 不把作物行本身称为机器人应行驶的走廊中心。
    - 不把检测出的图像左右行称为机器人实体宽度或安全边界。
    - 不宣称可以直接控制真实机器人。
    - 不宣称像素或归一化偏移等于米制横向误差。
    - 不宣称在未测试作物、相机、天气、夜间、地头或遮挡条件下可靠。
    - 不把同一数据源留出集称为独立外部测试。

input:
  modality: monocular_rgb
  unit: image_or_video_frame
  target_view: 地面农业机器人前视相机视角
  canonical_evaluation_size: [640, 360]
  coordinate_normalization: 使用各自图像宽高归一化，算法不得依赖固定像素尺寸。

output_contract:
  coordinate_system:
    pixel_origin: top_left
    pixel_x_positive: right
    pixel_y_positive: down
    normalized_x: x_px / (width - 1)
    normalized_y: y_px / (height - 1)
    normalized_range: [0.0, 1.0]
    camera_center_x_norm: 0.5
  required_fields:
    - crop_rows
    - corridor_left_boundary
    - corridor_right_boundary
    - corridor_centerline_points_norm
    - lateral_offset_norm
    - heading_error_deg
    - vanishing_point_norm
    - row_spacing_norm
    - confidence
    - status
  crop_rows:
    item_fields: [near_x_norm, far_x_norm, confidence, status]
    order: 按near评价横线处的x坐标从左到右排列。
    cardinality: 可变数量；不得固定假设恰好三行。
    visibility_rule: 只评价同时穿过near与far评价横线且具有足够标注支持的作物行。
  corridor_selection:
    rule: 在near评价横线处选择分别位于camera_center_x_norm左、右侧且最接近中心的有效作物行。
    crop_row_is_drivable_center: false
    corridor_center_rule: 左右边界在相同评价高度处的中点连线。
    missing_side_action: 缺少任意一侧可靠边界时不得输出valid走廊。
    physical_robot_frame_available: false
    limitation: 当前只能得到相机中心代理下的图像走廊；真实机器人边界与安全余量需要相机外参、安装偏置和车体尺寸。
  lateral_offset_norm:
    formula: corridor_center_near_x_norm - 0.5
    sign: 正值表示走廊中心在相机中心右侧，负值表示在左侧。
    limitation: 仅为图像平面归一化偏移，不是米制横向误差。
  heading_error_deg:
    formula: degrees(atan2(corridor_center_far_x_norm - corridor_center_near_x_norm, y_near_norm - y_far_norm))
    limitation: 相对图像竖直轴的方向代理，不是标定后的真实航向角。
  vanishing_point_norm:
    rule: 只使用不少于两条几何一致且非病态的作物行稳健估计；条件不满足时输出null并降级或拒绝。
  row_spacing_norm:
    rule: 在预定评价横线计算相邻行横向间距；只能用于图像内相对异常提示。
    limitation: 未标定时不能解释为真实米制行距，也不能仅凭单帧断言农业意义上的缺行。
  confidence:
    range: [0.0, 1.0]
    rule: 由行支持度、行组几何一致性、左右边界完整性、匹配不确定性及时序稳定性组成；不是概率。
  status:
    enum: [valid, degraded, reject]
    meanings:
      valid: 多行与左右走廊边界满足全部有效性检查，可进入离线评价。
      degraded: 存在部分可解释作物行，但边界、消失点或一致性条件较弱。
      reject: 无可靠行间走廊、输入不受支持或几何自相矛盾，不输出可用导航误差。

target_conditions:
  supported:
    - 白天、前视单目RGB、相机位置基本固定。
    - 左右至少各有一条满足可见性规则的作物行。
    - 直行和中等弯曲、相邻行在主要ROI内可区分。
    - 晴天、阴天、局部阴影、稀疏或较密杂草、局部断行。
  negative_or_unknown:
    - 到达地头、转弯区或画面中不存在可定义走廊。
    - 仅一侧作物行可见、严重粘连、夜间、运动模糊、过曝或完全遮挡。
    - 普通道路、室内、非农田和不可辨认输入。
    - 超出数据覆盖的作物、生长阶段、相机或地区。

failure_costs:
  highest: 把无可靠左右边界的帧错误标记为valid，或把中央作物行误当作可通行中心。
  medium: 漏检/误检作物行、选错左右边界、走廊中心或方向错误。
  lower: 对实际可用帧保守地输出degraded或reject。
  policy: 宁可拒绝，也不输出高置信度但边界不完整或几何不一致的走廊。

metrics_and_thresholds:
  - id: row_detection_precision
    definition: 通过顺序保持的一对一匹配后，匹配预测行数除以全部预测行数。
    threshold: ">= 0.80"
  - id: row_detection_recall
    definition: 通过顺序保持的一对一匹配后，匹配真值行数除以全部可评价真值行数。
    threshold: ">= 0.80"
  - id: matched_bottom_position_mae_norm
    definition: 已匹配预测行与真值行在near评价横线的横向绝对误差均值。
    threshold: "<= 0.05"
  - id: matched_heading_mae_deg
    definition: 已匹配预测行与真值行的局部方向绝对误差均值。
    threshold: "<= 5.0"
  - id: corridor_boundary_pair_accuracy
    definition: 可定义走廊帧中左右边界均匹配正确的比例。
    threshold: ">= 0.80"
  - id: corridor_center_mae_norm
    definition: 左右真值边界中点与预测走廊中心在near评价横线的横向绝对误差均值。
    threshold: "<= 0.05"
  - id: supported_valid_recall
    definition: 受支持且存在可靠左右边界的帧中输出valid的比例。
    threshold: ">= 0.80"
  - id: unsafe_false_valid_rate
    definition: 应拒绝帧中错误输出valid的比例。
    threshold: "<= 0.05"
  - id: runtime_median_ms
    definition: 当前笔记本CPU、640x360、单帧端到端处理的中位耗时。
    threshold: "<= 50.0"

acceptance_rules:
  internal_gate:
    rule: 多行、走廊、主要困难组和拒绝行为全部通过，才能冻结算法与阈值。
  frozen_external_gate:
    independent_source_required: true
    same_absolute_thresholds_as_internal: true
    gap_definition: 外部结果减内部结果；精确率、召回率和准确率使用内部结果减外部结果。
    gap_limits:
      row_detection_precision_drop: "<= 0.10"
      row_detection_recall_drop: "<= 0.10"
      matched_bottom_position_mae_norm: "<= 0.02"
      matched_heading_mae_deg: "<= 3.0"
      corridor_boundary_pair_accuracy_drop: "<= 0.10"
      corridor_center_mae_norm: "<= 0.02"
      unsafe_false_valid_rate: "<= 0.03"
      supported_valid_recall_drop: "<= 0.10"
    blocking_conditions:
      - external_threshold_failure
      - internal_external_gap_exceeded
      - missing_or_failed_major_condition_group
      - high_confidence_hard_negative_failure
      - unresolved_external_source_independence
    failure_action: 保留结果；使用独立OOD开发证据改进或缩小声明，不得用冻结外部结果直接调参。

hardware_and_delivery:
  development_hardware: 当前Windows笔记本CPU
  implementation_language: Python 3 + OpenCV，优先建立可解释多行基线
  deliverables:
    - 可复现代码与配置
    - 多行标签审计和证据登记
    - 多行匹配、走廊选择和分组失败分析
    - 图片或视频离线演示
    - Day70中文总结与导师汇报摘要

evidence_roles:
  open_source_review: 只用于任务设计、基线选择和指标定义，不作为本项目效果证据。
  id_development: 可用于普通开发和阈值选择，必须按最高泄漏单位分组。
  ood_development: 可用于稳健性改进，必须记录每次迭代。
  frozen_external_test: 必须来自独立来源，冻结后不得反向调整算法、阈值或置信度。

out_of_scope:
  - 真实机器人闭环控制、路径规划、避障和安全认证
  - ROS/Gazebo系统集成
  - 多相机、深度相机、LiDAR、GPS或IMU融合
  - 未取得相机标定与车体几何前的真实机器人边界、米制走廊和安全余量
  - 未通过数据门禁前的大规模训练
